version: "3.9"

services:

  db:
    image: postgres:16

    container_name: task_db

    restart: always

    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    working_dir: /app/src
    container_name: task_app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis
      - kafka
      - clickhouse

    env_file:
      - .env
  worker:
    build: .
    container_name: task_worker
    working_dir: /app/src

    command: taskiq worker worker:broker 

    volumes:
      - .:/app

    depends_on:
      - redis

    env_file:
      - .env
  redis:
    image: redis:7-alpine
    container_name: task_redis

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}

    restart: always

    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:3.9.1

    container_name: task_kafka

    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka_ui:
    image: provectuslabs/kafka-ui:latest

    container_name: task_kafka_ui

    restart: always

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka
  consumer:
    build: .
    container_name: task_consumer
    working_dir: /app/src

    command: sh -c "sleep 15 && python -u consumer.py"
 
    environment:
      - PYTHONUNBUFFERED=1

    volumes:
      - .:/app

    depends_on:
      - kafka
      - clickhouse

    env_file:
      - .env

  clickhouse:
    image: clickhouse/clickhouse-server:24.8

    container_name: task_clickhouse

    restart: always

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse

    volumes:
      - clickhouse_data:/var/lib/clickhouse
volumes:
  postgres_data:
  kafka_data:
  clickhouse_data: