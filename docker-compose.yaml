version: "3.9"

services:

  db:
    image: postgres:16

    container_name: task_db

    restart: always

    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    working_dir: /app/src
    container_name: task_app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env
  redis:
    image: redis:7-alpine
    container_name: task_redis

    command: redis-server --requirepass redis_password

    ports:
      - "6379:6379"

    restart: always

  worker:
    build: .
    working_dir: /app/src

    container_name: celery_worker

    command: celery -A core.celery:celery_app worker --loglevel=info

    volumes:
      - .:/app

    depends_on:
      - redis
      - db

    env_file:
      - .env

volumes:

  postgres_data: